<script>
/* ==========================================================================
   ESOP Exercise Portal — client.
   One RPC door, one render function per screen, no framework.
   ========================================================================== */
(function () {
  'use strict';


  /* ---------------- state ---------------- */


  var S = {
    boot: null,
    token: null,
    user: null,
    view: 'login',          // login | setpw | emp | admin | fp
    authTab: 'login',       // login | reset
    resetStage: 'request',  // request | code
    resetUserId: '',
    tab: '',                // employee stage, or admin tab
    dash: null,             // employee dashboard payload
    admin: null,            // admin queue payload
    adminDetail: null,
    adminSub: null,         // employees | fmv | users | config payloads
    fp: null,
    busy: {},
    draft: {},              // unsaved form values, keyed by field
    files: {},              // staged uploads, keyed by field
    // Set when a repeat application has been started but not yet saved. The
    // dashboard still carries the approved application — it is the most
    // recent one — so without this the options form treats that approval as
    // the thing being edited and locks itself. Saving the options is what
    // mints the new application on the server; this covers the gap.
    startingNew: false,
    // A confirmation of the last thing that was recorded. A toast disappears
    // after five seconds, which is no use for an action someone needs proof
    // of having completed — these stay on screen until dismissed.
    ack: null,              // employee
    adminAck: null,         // an approve / send back / reject decision
    fpAck: null             // a fund partner payment
  };


  var TOKEN_KEY = 'esop.token';


  /* ---------------- plumbing ---------------- */


  /**
   * How many server calls are in flight, and the bar that shows it.
   *
   * Per-button spinners cover buttons; this covers everything else — a table
   * row that opens a record, a dialog that loads, an action whose handler
   * forgot its spinner. Every call goes through api(), so this cannot be
   * forgotten the way a data-busy attribute can.
   */
  var _inflight = 0;
  function netBar(delta) {
    _inflight = Math.max(0, _inflight + delta);
    var el = document.getElementById('netbar');
    if (el) el.hidden = _inflight === 0;
    if (_inflight === 0) workScreen(false); else workScreen(true);
  }


  /**
   * The working screen.
   *
   * The thin bar is right for a call that returns in half a second; it is not
   * enough for one that takes four, where the page looks frozen and people
   * click again. So after a short delay this covers the window, holds it
   * still, and rotates a fact — the wait exists either way, and Apps Script
   * always has one.
   *
   * The delay matters as much as the screen: flashing an overlay for every
   * quick call would be worse than showing nothing.
   */
  var _workTimer = null, _factTimer = null, _factIndex = 0;


  function workScreen(on) {
    var box = document.getElementById('working');
    if (!box) return;


    if (!on) {
      if (_workTimer) { clearTimeout(_workTimer); _workTimer = null; }
      if (_factTimer) { clearInterval(_factTimer); _factTimer = null; }
      box.hidden = true;
      return;
    }


    if (_workTimer || !box.hidden) return;          // already waiting or shown
    // The boot screen covers the first call on its own.
    var boot = document.getElementById('boot');
    if (boot && !boot.hidden) return;


    // Whatever the button said it was doing — "Saving…", "Sending…" — reads
    // better than a generic word, and it is already on the button that was
    // pressed.
    var what = 'Working…';
    if (_lastClicked) {
      // The button may already be showing its own spinner label, so trim any
      // ellipsis before adding one.
      var t = (_lastClicked.textContent || '').trim().replace(/[.…\s]+$/, '');
      what = _lastClicked.dataset.busyLabel || (t ? t + '…' : what);
    }


    _workTimer = setTimeout(function () {
      _workTimer = null;
      if (_inflight === 0) return;                  // it came back in time
      var label = document.getElementById('workingWhat');
      if (label) label.textContent = what;
      rotateFact(true);
      box.hidden = false;
      _factTimer = setInterval(function () { rotateFact(false); }, 4200);
    }, 700);
  }


  function rotateFact(first) {
    var host = document.getElementById('workingFact');
    var facts = (S.boot && S.boot.facts && S.boot.facts.length)
      ? S.boot.facts : (window._facts || []);
    if (!host || !facts.length) { if (host) host.innerHTML = ''; return; }
    if (first) _factIndex = Math.floor(Math.random() * facts.length);
    var paint = function () {
      host.innerHTML = '<span>Did you know</span> ' + h(facts[_factIndex % facts.length]) + '?';
      host.style.opacity = 1;
      _factIndex++;
    };
    if (first) { paint(); return; }
    host.style.opacity = 0;
    setTimeout(paint, 220);
  }


  function api(method, payload) {
    netBar(1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          netBar(-1);
          if (!res) { reject(new Error('The server returned nothing. Please try again.')); return; }
          if (res.ok) { resolve(res.data); return; }
          if (res.authFailure) {
            S.token = null; S.user = null; S.view = 'login';
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
            render();
          }
          reject(new Error(res.error || 'Something went wrong.'));
        })
        .withFailureHandler(function (err) {
          netBar(-1);
          reject(new Error((err && err.message) ? err.message : 'The portal could not reach the server.'));
        })
        .rpc(method, S.token, payload || {});
    });
  }


  function h(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }


  function toast(msg, kind) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.hidden = true; }, kind === 'err' ? 9000 : 5000);
  }


  function fail(e) { toast((e && e.message) ? e.message : String(e), 'err'); }


  /**
   * The button the user last pressed, tracked in the capture phase so it is
   * known before any handler runs.
   *
   * This is what lets a button show progress without having to declare
   * data-busy. Requiring that attribute meant every new action button looked
   * dead until someone remembered to add it — and a button that does nothing
   * visible for a second reads as broken, so the user presses it again.
   */
  var _lastClicked = null;
  document.addEventListener('click', function (e) {
    _lastClicked = (e.target && e.target.closest) ? e.target.closest('button') : null;
  }, true);


  var _busyEl = {};


  function busy(key, on) {
    S.busy[key] = !!on;
    // Prefer an explicitly marked button; otherwise fall back to whatever was
    // just pressed, remembering it so the label can be put back afterwards.
    var b = document.querySelector('[data-busy="' + key + '"]');
    if (on) {
      b = b || _lastClicked;
      _busyEl[key] = b || null;
    } else {
      b = b || _busyEl[key];
      delete _busyEl[key];
    }
    if (!b) return;
    b.disabled = !!on;
    if (on) {
      // Keep the width so the row does not jump as the label changes.
      if (b.offsetWidth) b.style.minWidth = b.offsetWidth + 'px';
      b._label = b.innerHTML;
      b.innerHTML = '<span class="spinner"></span>' + (b.dataset.busyLabel || 'Working…');
    } else if (b._label) {
      b.innerHTML = b._label;
      b._label = null;
      b.style.minWidth = '';
    }
  }


  /**
   * Run an async action with the button showing progress.
   * `key` may be omitted — one is derived from the button that was pressed,
   * so any handler gets the busy state for free.
   */
  var _actSeq = 0;
  function act(key, fn) {
    if (typeof key === 'function') { fn = key; key = null; }
    if (!key) {
      if (_lastClicked) {
        if (!_lastClicked._actKey) _lastClicked._actKey = 'auto' + (++_actSeq);
        key = _lastClicked._actKey;
      } else {
        key = 'auto' + (++_actSeq);
      }
    }
    if (S.busy[key]) return Promise.resolve();   // ignore a double press
    busy(key, true);
    return Promise.resolve().then(fn)
      .catch(function (e) { fail(e); })
      .then(function () { busy(key, false); });
  }


  /* ---------------- formatting ---------------- */


  function inr(n, dp) {
    var v = Number(n || 0);
    return '₹' + v.toLocaleString('en-IN', {
      minimumFractionDigits: dp === undefined ? 0 : dp,
      maximumFractionDigits: dp === undefined ? 0 : dp
    });
  }
  function cnt(n) { return Number(n || 0).toLocaleString('en-IN'); }
  function shortInr(n) {
    var v = Number(n || 0);
    if (v >= 1e7) return '₹' + (v / 1e7).toFixed(2) + ' Cr';
    if (v >= 1e5) return '₹' + (v / 1e5).toFixed(2) + ' L';
    return inr(v);
  }
  /* ---------------- money in words ---------------- */


  var ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
    'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
    'Seventeen', 'Eighteen', 'Nineteen'];
  var TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];


  function twoDigits(n) {
    if (n < 20) return ONES[n];
    return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
  }


  /**
   * Amount in words on the Indian scale — crore, lakh, thousand, hundred.
   *
   * On the figures that commit someone to paying, the words are the check
   * that the digits were read correctly. A transposed lakh is easy to miss
   * in "₹2,30,926" and impossible to miss in "Two Lakh Thirty Thousand".
   */
  function inWords(amount) {
    var v = Math.abs(Math.round(Number(amount || 0) * 100) / 100);
    var whole = Math.floor(v);
    var paise = Math.round((v - whole) * 100);


    var say = function (n) {
      if (n === 0) return 'Zero';
      var parts = [];
      var crore = Math.floor(n / 10000000); n %= 10000000;
      var lakh = Math.floor(n / 100000); n %= 100000;
      var thousand = Math.floor(n / 1000); n %= 1000;
      var hundred = Math.floor(n / 100); n %= 100;
      if (crore) parts.push(twoDigits(crore) + ' Crore');
      if (lakh) parts.push(twoDigits(lakh) + ' Lakh');
      if (thousand) parts.push(twoDigits(thousand) + ' Thousand');
      if (hundred) parts.push(ONES[hundred] + ' Hundred');
      if (n) parts.push(twoDigits(n));
      return parts.join(' ');
    };


    var out = 'Rupees ' + say(whole);
    if (paise) out += ' and ' + twoDigits(paise) + ' Paise';
    return (Number(amount) < 0 ? 'Minus ' : '') + out + ' only';
  }


  /** An amount with its words underneath — for figures someone pays against. */
  function inrWithWords(n) {
    return '<span class="amt-words">' + h(inr(n)) + '<em>' + h(inWords(n)) + '</em></span>';
  }


  /* ---------------- "how was this worked out" ---------------- */


  var _calcs = {};
  var _calcSeq = 0;


  function resetCalcs() { _calcs = {}; _calcSeq = 0; }


  /**
   * An ⓘ button that opens the arithmetic behind a figure.
   *
   * `spec` is { title, formula, steps: [[label, value], …], result, note }.
   * The steps carry the actual values used, not just the shape of the sum —
   * the question people ask is "where did *this* number come from", and a
   * formula alone does not answer it.
   */
  function calc(spec) {
    var id = 'calc' + (++_calcSeq);
    _calcs[id] = spec;
    return '<button type="button" class="ibtn" data-calc="' + id +
      '" aria-label="How ' + h(spec.title) + ' is worked out">i</button>';
  }


  function showCalc(id) {
    var c = _calcs[id];
    if (!c) return;
    var rows = (c.steps || []).map(function (s) {
      return '<div class="line' + (s[2] ? ' ' + s[2] : '') + '"><span class="lbl">' + h(s[0]) +
        '</span><span class="lead"></span><span class="amt">' + h(s[1]) + '</span></div>';
    }).join('');
    var secs = (c.sections || []).map(function (sec) {
      var lines = (sec.steps || []).map(function (st) {
        return '<div class="line' + (st[2] ? ' ' + st[2] : '') + '"><span class="lbl">' + h(st[0]) +
          '</span><span class="lead"></span><span class="amt">' + h(st[1]) + '</span></div>';
      }).join('');
      return '<div class="note" style="margin-top:14px"><div class="engrave"></div><h3>' + h(sec.heading) + '</h3>' +
        (sec.text ? '<div class="subh" style="margin:0 17px 6px">' + sec.text + '</div>' : '') +
        '<div class="lines">' + lines + '</div></div>';
    }).join('');
    modal('<h2 class="sec">' + h(c.title) + '</h2>' +
      (c.formula ? '<div class="formula">' + h(c.formula) + '</div>' : '') +
      secs +
      (rows ? '<div class="note" style="margin-top:16px"><div class="engrave"></div>' +
        '<h3>With your figures</h3><div class="lines">' + rows + '</div></div>' : '') +
      (c.result ? '<div class="callout" style="margin-top:14px"><h4>' + h(c.result) + '</h4>' +
        (c.resultWords ? '<p class="mono" style="font-size:12px">' + h(c.resultWords) + '</p>' : '') +
        '</div>' : '') +
      (c.note ? '<p class="hint" style="margin-top:14px">' + c.note + '</p>' : '') +
      '<div class="row" style="margin-top:18px"><button class="btn ghost" id="calcDone">Close</button></div>');
    document.getElementById('calcDone').addEventListener('click', closeModal);
  }


  /**
   * The tax on an exercise, explained.
   *
   * `t` = { method, breakdown, tax, perquisite, flatRate }, from an application,
   * a live quote or an indicative figure. When the tax was worked out from the
   * participant's year-to-date position (method "Sheet") this walks through
   * every stage in plain words; when it is a flat percentage it says so and
   * says why. The numbers all come from the breakdown the server stored: this
   * function does no tax arithmetic of its own.
   */
  function taxSrc(a) {
    return { method: a.taxMethod, breakdown: a.taxBreakdown, tax: a.taxAmount,
      perquisite: a.perquisiteAmount, flatRate: a.taxRatePercent };
  }


  function taxLabel(t) {
    if (t.method === 'Sheet') return 'Tax on this exercise';
    return 'Tax at ' + t.flatRate + '%' + (t.flatRate ? ' (estimate)' : '');
  }


  function taxExplain(t, opts) {
    opts = opts || {};
    var b = t.breakdown;


    if (!b || b.method !== 'Sheet') {
      var rate = b && b.ratePercent !== undefined ? b.ratePercent : t.flatRate;
      var why = b && b.reason ? b.reason : '';
      return {
        title: 'Tax on the perquisite',
        formula: 'tax = perquisite × a flat percentage (an estimate)',
        steps: [
          ['Perquisite', inr(t.perquisite)],
          ['Percentage used', (rate || 0) + '%'],
          ['Tax (estimate)', inr(t.tax), 'total']
        ].concat(opts.extra || []),
        result: inr(t.tax),
        resultWords: inWords(t.tax),
        note: rate
          ? '<b>This is an estimate.</b> ' + (why ? h(why) + '. ' : '') + 'Tax is charged on a whole year\u2019s ' +
            'income, so the exact figure depends on your income for the year, which the ESOP team loads from ' +
            'payroll. Once that is loaded this is recalculated and explained step by step.'
          : 'Your tax has not been worked out yet, so this shows nil. <b>It is not the real figure.</b> ' +
            'The ESOP team loads your income position from payroll, after which it is calculated and explained here.'
      };
    }


    var rateTxt = b.surchargeRate + '%';
    var cessAmt = Math.max(0, b.collect - (b.dBase + b.ownSurcharge + b.cliffNow));
    var regimeTxt = b.regime === 'Old' ? 'old tax regime' : 'new tax regime';


    var secs = [
      { heading: 'Step 1 \u2014 Your income for the year',
        text: 'From payroll, as on ' + h(pretty(b.asOn)) + '. You are on the ' + h(regimeTxt) + '.',
        steps: [
          ['Income earned so far this year', inr(b.earned)],
          ['Expected for the rest of the year', inr(b.future)]
        ].concat(b.priorPerquisite > 0 ? [['Exercises approved since payroll\u2019s date', inr(b.priorPerquisite)]] : [])
         .concat([['Taxable income for the year, before this exercise', inr(b.incomeBefore), 'total']]) },
      { heading: 'Step 2 \u2014 What this exercise adds',
        steps: [
          ['Perquisite from this exercise', inr(b.perquisite)],
          ['Taxable income for the year, after this exercise', inr(b.incomeAfter), 'total']
        ] },
      { heading: 'Step 3 \u2014 The year\u2019s tax, with and without it',
        text: 'Tax is charged on a whole year\u2019s income, so we work it out both ways. Each figure is the slab tax, ' +
          'plus surcharge where it applies, plus ' + h(b.cessPercent) + '% cess.',
        steps: [
          ['Year\u2019s tax without this exercise', inr(b.totalBefore)],
          ['Year\u2019s tax with this exercise', inr(b.totalAfter)],
          ['Extra tax this exercise causes', inr(b.whole), 'total']
        ].concat(b.surchargeRate > 0
          ? [['Surcharge band your income falls in', rateTxt + ' of the tax']] : []) },
      { heading: 'Step 4 \u2014 What you pay now',
        steps: [
          ['Tax on the perquisite itself', inr(b.dBase)]
        ].concat(b.surchargeRate > 0 ? [['Surcharge on that tax (' + rateTxt + ')', inr(b.ownSurcharge)]] : [])
         .concat(b.cliff > 0 ? [['Extra surcharge on income you have already earned', inr(b.cliffNow)]] : [])
         .concat([
          ['Cess (' + b.cessPercent + '%)', inr(cessAmt)],
          ['Tax to pay now', inr(b.collect), 'total']
        ]).concat(b.left > 0 ? [['Left for payroll over your remaining months', inr(b.left), 'sub']] : []) }
    ];


    if (opts.admin) {
      secs.push({ heading: 'For the ESOP team',
        steps: [
          ['Share of the year\u2019s income already earned', (b.earnedShare * 100).toFixed(1) + '%'],
          ['Remaining months of payroll', String(b.remainingMonths)],
          ['Tax deducted by payroll to date', inr(b.tdsToDate)],
          ['Outside tax / advance tax recorded', inr(b.outsideTax)]
        ].concat(opts.extra || []) });
    }


    var notes = [];
    if (b.cliff > 0) {
      notes.push('Because this exercise takes your income into the <b>' + h(rateTxt) + ' surcharge band</b>, that ' +
        'higher surcharge applies to your whole year\u2019s tax \u2014 including the tax on salary you have already earned. ' +
        'We collect now the part linked to income you have <b>already earned</b> (' + h(inr(b.cliffNow)) + '). ' +
        'The part linked to <b>future</b> salary (' + h(inr(b.cliffLater)) + ') is not collected now; your payroll ' +
        'adjusts your monthly tax deduction for it, because you may not be with the company by then.');
    } else if (b.surchargeRate > 0) {
      notes.push('Your income is in the ' + h(rateTxt) + ' surcharge band, and was before this exercise too, so the ' +
        'surcharge is charged only on the tax this exercise adds.');
    }
    if (b.marginalRelief > 0) {
      notes.push('<b>Marginal relief</b> reduced the surcharge by ' + h(inr(b.marginalRelief)) + ': just over a ' +
        'surcharge limit, tax plus surcharge can never rise by more than the income above the limit.');
    }
    notes.push('These figures use payroll\u2019s position as on ' + h(pretty(b.asOn)) + '. If it changes, the ESOP team ' +
      'reloads it and this is recalculated.');


    return {
      title: 'Tax on this exercise',
      formula: 'tax now = tax on the perquisite + its surcharge + surcharge on income already earned + cess',
      sections: secs,
      result: inr(b.collect),
      resultWords: inWords(b.collect),
      note: notes.join('<br><br>')
    };
  }


  // Delegated once, so every \u24d8 on every screen works without re-binding.
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-calc]') : null;
    if (b) { e.preventDefault(); showCalc(b.getAttribute('data-calc')); }
  });


  function pretty(dateKey) {
    if (!dateKey) return '';
    var m = String(dateKey).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(dateKey);
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return m[3] + ' ' + MON[Number(m[2]) - 1] + ' ' + m[1];
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function shiftDays(dateKey, n) {
    var m = String(dateKey).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return dateKey;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }


  /* ---------------- form helpers ---------------- */


  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }
  function checked(id) {
    var el = document.getElementById(id);
    return el ? !!el.checked : false;
  }


  /** Read a chosen file into base64 for the RPC payload. */
  function readFile(inputId) {
    var input = document.getElementById(inputId);
    if (!input || !input.files || !input.files.length) return Promise.resolve(null);
    var file = input.files[0];
    var maxMb = (S.boot && S.boot.maxUploadMb) || 8;
    if (file.size > maxMb * 1024 * 1024) {
      return Promise.reject(new Error('"' + file.name + '" is ' + (file.size / 1048576).toFixed(1) +
        ' MB. The limit is ' + maxMb + ' MB — compress it or upload a smaller scan.'));
    }
    var allowed = ['application/pdf', 'image/jpeg', 'image/png'];
    if (allowed.indexOf(file.type) < 0) {
      return Promise.reject(new Error('"' + file.name + '" is not a PDF, JPG or PNG.'));
    }
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        resolve({ name: file.name, mimeType: file.type, dataBase64: s.slice(s.indexOf(',') + 1) });
      };
      fr.onerror = function () { reject(new Error('"' + file.name + '" could not be read.')); };
      fr.readAsDataURL(file);
    });
  }


  function fileField(id, label, current, hint, required) {
    return '<div class="field">' +
      '<label for="' + id + '">' + h(label) +
      (required ? ' <span class="req">required</span>' : '') + '</label>' +
      '<div class="filebox">' +
      '<input type="file" id="' + id + '" accept="application/pdf,image/jpeg,image/png">' +
      (current
        ? '<div class="cur"><span class="pill ok">On file</span>' +
          '<span class="name">' + h(current.name) + '</span>' +
          '<span class="dim">' + cnt(current.sizeKb) + ' KB</span>' +
          '<span class="dim">Choosing a new file replaces it.</span></div>'
        : '<div class="cur"><span class="pill wait">Not uploaded</span></div>') +
      '</div>' +
      (hint ? '<div class="hint">' + h(hint) + '</div>' : '') +
      '</div>';
  }


  /* ---------------- modal ---------------- */


  function modal(html, cls) {
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBody').className = cls || 'modal-bd';
    document.getElementById('modal').hidden = false;
  }
  function closeModal() {
    document.getElementById('modal').hidden = true;
    releaseDocUrls();   // a previewed document can be several MB; don't hold it
  }


  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal();
  });


  /* ======================================================================
     RENDER
     ====================================================================== */


  /**
   * A loading panel that shows a rotating fact rather than a bare "Loading…".
   *
   * Apps Script always has a wait — a round trip is half a second at best —
   * so the wait may as well tell the reader something useful about the
   * scheme. The facts come from the LOADING_FACTS setting.
   */
  function loadingPanel(what) {
    var facts = (S.boot && S.boot.facts) || [];
    var fact = facts.length ? facts[Math.floor(Math.random() * facts.length)] : '';
    return '<div class="page"><div class="loadbox">' +
      '<div class="boot-mark"></div>' +
      '<div class="loadwhat">' + h(what) + '</div>' +
      (fact ? '<div class="boot-fact"><span>Did you know</span> ' + h(fact) + '?</div>' : '') +
      '</div></div>';
  }


  function render() {
    var app = document.getElementById('app');
    document.getElementById('boot').hidden = true;
    app.hidden = false;
    // The boot screen's own rotation is done with once the app is showing.
    if (window._bootFacts) { clearInterval(window._bootFacts); window._bootFacts = null; }
    // The ⓘ explanations are registered while the markup is built, so the
    // registry belongs to this render and nothing else.
    resetCalcs();


    if (!S.token || !S.user) { app.innerHTML = renderAuth(); bindAuth(); return; }
    if (S.user.mustResetPassword) { app.innerHTML = renderAuth(true); bindAuth(); return; }


    var body = '';
    if (S.user.role === 'Employee') body = renderEmployee();
    else if (S.user.role === 'Admin') body = renderAdmin();
    else if (S.user.role === 'FundPartner') body = renderPartner();
    else body = '<div class="page"><div class="empty">Your login has no role assigned. Contact the ESOP team.</div></div>';


    app.innerHTML = topbar() + body;
    bindCommon();
    if (S.user.role === 'Employee') bindEmployee();
    if (S.user.role === 'Admin') bindAdmin();
    if (S.user.role === 'FundPartner') bindPartner();
  }


  /**
   * The company logo, or nothing when none is configured.
   * `cls` picks the size: 'mark' in the top bar, 'crest' on the sign-in page.
   */
  function logoImg(cls) {
    var src = S.boot && S.boot.logo;
    if (!src) return '';
    return '<img class="logo ' + cls + '" src="' + src + '" alt="' +
      h((S.boot && S.boot.companyName) || 'Company') + '">';
  }


  function topbar() {
    var nav = '';
    if (S.user.role === 'Admin') {
      nav = [['queue', 'Verification queue'], ['employees', 'Participants'], ['fmv', 'Share price'],
             ['users', 'Logins'], ['config', 'Settings'], ['guide', 'Guide']]
        .map(function (t) {
          return '<button data-nav="' + t[0] + '" aria-current="' + (S.tab === t[0]) + '">' + h(t[1]) + '</button>';
        }).join('');
    }
    return '<div class="topbar"><div class="topbar-in">' +
      '<div class="brand">' +
      logoImg('mark') +
      '<div><span class="co">' + h((S.boot && S.boot.companyName) || '') + '</span>' +
      '<span class="nm">ESOP Exercise Portal</span></div>' +
      '</div>' +
      (nav ? '<nav class="topnav">' + nav + '</nav>' : '') +
      '<div class="who">' +
      '<span class="role">' + h(S.user.role === 'FundPartner' ? 'Fund partner' : S.user.role) + '</span>' +
      '<span><b>' + h(S.user.name || S.user.userId) + '</b></span>' +
      '<button class="btn link" id="changePwBtn">Password</button>' +
      '<button class="btn link" id="signOutBtn">Sign out</button>' +
      '</div></div></div>';
  }


  function bindCommon() {
    var so = document.getElementById('signOutBtn');
    if (so) so.addEventListener('click', function () {
      S.token = null; S.user = null; S.view = 'login'; S.dash = null; S.admin = null; S.fp = null;
      try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
      render();
    });
    var cp = document.getElementById('changePwBtn');
    if (cp) cp.addEventListener('click', showChangePassword);
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { goAdminTab(b.dataset.nav); });
    });
  }


  function showChangePassword() {
    modal(
      '<h2 class="sec">Change your password</h2>' +
      '<p class="lede">Changing it signs you out everywhere else.</p>' +
      '<div class="divider"></div>' +
      '<div class="field"><label for="cpCur">Current password</label>' + pwInput('cpCur', 'current-password') + '</div>' +
      '<div class="field"><label for="cpNew">New password</label>' + pwInput('cpNew', 'new-password') +
      '<div class="hint">At least 8 characters, with a letter and a digit.</div></div>' +
      '<div class="field"><label for="cpNew2">New password again</label>' + pwInput('cpNew2', 'new-password') + '</div>' +
      '<div class="row" style="margin-top:18px">' +
      '<button class="btn" id="cpGo" data-busy="cp" data-busy-label="Changing…">Change password</button>' +
      '<button class="btn ghost" id="cpCancel">Cancel</button></div>'
    );
    document.getElementById('cpCancel').addEventListener('click', closeModal);
    document.getElementById('cpGo').addEventListener('click', function () {
      if (val('cpNew') !== val('cpNew2')) { toast('The two new passwords do not match.', 'err'); return; }
      act('cp', function () {
        return api('auth.changePassword', { currentPassword: val('cpCur'), newPassword: val('cpNew') })
          .then(function (r) {
            S.token = r.token;

            closeModal();
            toast(r.message, 'ok');
          });

  function renderAuth(forceSet) {
    var b = S.boot || {};

    var tabs = '<div class="authtabs">' +
      '<button data-atab="login" aria-current="' + (S.authTab === 'login') + '">Sign in</button>' +
      '<button data-atab="reset" aria-current="' + (S.authTab === 'reset') + '">Set or reset password</button>' +
      '</div>';

        '<div class="hint">Either works. If you have left the company, use the employee code you had, or the personal email address on your ESOP record.</div></div>' +
        '<div class="field"><label for="lgPw">Password</label>' +
        pwInput('lgPw', 'current-password') + '</div>' +
        '<div class="row" style="margin-top:20px">' +

        '<div class="row" style="margin-top:13px"><button class="btn link" data-atab="reset">Forgot your password?</button></div>';
    } else if (S.resetStage === 'request') {

      body =

        '<p class="hint">We will email a one-time code to the address on your record — your personal address if you have left the company. It is valid for ' +
        h(b.resetCodeMinutes || 30) + ' minutes.</p>' +
        '<div class="row" style="margin-top:20px">' +
        '<button class="btn block" id="rqGo" data-busy="rq" data-busy-label="Sending…">Email me a code</button></div>' +
        '<div class="row" style="margin-top:13px">' +
        '<button class="btn link" id="rqHaveCode">I already have a code</button></div>';
    } else {
      // The default for this tab. Someone who was invited holds a code
      // already, so the form that uses it is what they should land on —
      // previously the only route here was to press "Email me a code", which
      // issued a NEW code and silently killed the one in their inbox.
      body =
        (forceSet ? '<div class="callout info" style="margin-bottom:18px"><h4>Set your own password</h4>' +
          '<p>This login still uses the one-time code you were emailed. Choose a password to finish setting it up.</p></div>' : '') +
        '<div class="field"><label for="stId">Employee code or email</label>' +
        '<input type="text" id="stId" value="' + h(S.resetUserId) + '"' + (forceSet ? ' disabled' : '') +
        ' placeholder="PW1130, you@pw.live or FP-…"></div>' +
        '<div class="field"><label for="stCode">One-time code</label>' +
        '<input type="text" id="stCode" class="mono" inputmode="numeric" maxlength="6" placeholder="6 digits" autocomplete="one-time-code">' +
        '<div class="hint">From the email you were sent. Valid for ' + h(b.resetCodeMinutes || 30) +
        ' minutes, and it works once.</div></div>' +
        '<div class="field"><label for="stPw">Choose a password</label>' +
        pwInput('stPw', 'new-password') +
        '<div class="hint">At least 8 characters, with a letter and a digit.</div></div>' +
        '<div class="field"><label for="stPw2">Password again</label>' +
        pwInput('stPw2', 'new-password') + '</div>' +
        '<div class="row" style="margin-top:20px">' +
        '<button class="btn block" id="stGo" data-busy="st" data-busy-label="Saving…">Set password and sign in</button></div>' +
        (forceSet ? '' :
          '<div class="row" style="margin-top:13px">' +
          '<button class="btn link" id="stResend">I don\'t have a code — email me one</button></div>');
    }


    return '<div class="authwrap"><div class="authcard">' +
      '<div class="mast">' +
      logoImg('crest') +
      '<div class="eyebrow">' + h(b.companyName || '') + (b.planName ? ' · ' + h(b.planName) : '') + '</div>' +
      '<h1>Option <em>Exercise</em> Portal</h1>' +
      '</div>' +
      '<div class="authpanel"><div class="engrave"></div>' + tabs +
      '<div class="bd">' + body + '</div></div>' +
      '<div class="authfoot">' +
      'Exercise price is ' + inr(b.exercisePrice || 1, 2) + ' per option and options are exercised in multiples of ' +
      h(b.lotSize || 10) + '.' +
      (b.supportEmail ? '<br>Trouble signing in? Write to <a href="mailto:' + h(b.supportEmail) + '">' + h(b.supportEmail) + '</a>.' : '') +
      '</div></div></div>';

  function bindAuth() {
    document.querySelectorAll('[data-atab]').forEach(function (el) {
      el.addEventListener('click', function () {
        S.authTab = el.dataset.atab;
        // Land on the form that USES a code, not the one that asks for a new
        // one. Anyone opening this tab from an invitation email is holding a
        // code already.
        S.resetStage = 'code';
        render();
      });
    });


    bindIf('rqHaveCode', null, function () { S.resetStage = 'code'; render(); });


    var lgGo = document.getElementById('lgGo');
    if (lgGo) {
      var submitLogin = function () {
        act('login', function () {
          return api('auth.login', { userId: val('lgId'), password: val('lgPw') }).then(function (r) {
            S.token = r.token; S.user = r.user;
            try { sessionStorage.setItem(TOKEN_KEY, r.token); } catch (e) {}
            if (r.user.mustResetPassword) { S.resetUserId = r.user.userId; render(); return; }
            return afterLogin(r.home);
          });
        });
      };
      lgGo.addEventListener('click', submitLogin);
      ['lgId', 'lgPw'].forEach(function (id) {
        document.getElementById(id).addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submitLogin();
        });
      });
      document.getElementById('lgId').focus();
    }


    var rqGo = document.getElementById('rqGo');
    if (rqGo) {
      rqGo.addEventListener('click', function () {
        act('rq', function () {
          var id = val('rqId');
          if (!id.trim()) throw new Error('Enter your user ID.');
          return api('auth.requestResetCode', { userId: id }).then(function (r) {
            S.resetUserId = id.trim().indexOf('@') >= 0 ? id.trim() : id.trim().toUpperCase();
            S.resetStage = 'code';
            render();
            toast(r.message, 'ok');
          });
        });
      });
      document.getElementById('rqId').focus();
    }


    var stGo = document.getElementById('stGo');
    if (stGo) {
      stGo.addEventListener('click', function () {
        act('st', function () {
          if (val('stPw') !== val('stPw2')) throw new Error('The two passwords do not match.');
          return api('auth.setPasswordWithCode', {
            userId: S.resetUserId || val('stId'),
            code: val('stCode'),
            newPassword: val('stPw')
          }).then(function (r) {
            S.token = r.token; S.user = r.user;
            try { sessionStorage.setItem(TOKEN_KEY, r.token); } catch (e) {}
            toast('Password set. Welcome in.', 'ok');
            return afterLogin();
          });
        });
      });
      // Absent when the password is being forced on first sign-in — there is
      // no point offering a fresh code to someone already signed in with one.
      bindIf('stResend', 'stR', function () {
        var who = S.resetUserId || val('stId');
        if (!who.trim()) throw new Error('Enter your employee code or email first.');
        return api('auth.requestResetCode', { userId: who })
          .then(function (r) { toast(r.message, 'ok'); });
      });


      // Focus whichever field they actually need to fill first.
      var idEl = document.getElementById('stId');
      var codeEl = document.getElementById('stCode');
      if (idEl && !idEl.disabled && !idEl.value.trim()) idEl.focus();
      else if (codeEl) codeEl.focus();
    }
  }


  /**
   * `home` is the landing payload when boot or login already fetched it.
   * Its `kind` must match the role, or we ignore it and fetch properly.
   */
  function afterLogin(home) {
    var pre = function (kind) {
      return (home && home.kind === kind) ? home.data : null;
    };
    if (S.user.role === 'Employee') return loadEmployee(pre('employee'));
    if (S.user.role === 'Admin') { S.tab = 'queue'; return loadAdminQueue(pre('admin')); }
    if (S.user.role === 'FundPartner') return loadPartner(pre('partner'));
    render();
  }


  /* ======================================================================
     EMPLOYEE
     ====================================================================== */


  /**
   * `preloaded` is the dashboard when it arrived with the boot or login call,
   * saving a round trip. Everything else calls this with no argument.
   */
  function loadEmployee(preloaded) {
    var settle = function (d) {
      S.dash = d;
      // The repeat application now exists, so the real one takes over from
      // the pretend-empty state. Also clears itself if the chance to start
      // another went away (the window closed, the balance ran out).
      if (S.startingNew && ((d.application && d.application.editable) || !d.canStartAnother)) {
        S.startingNew = false;
      }
      if (!S.tab || ['options','demat','exercise','tax','notice','submit'].indexOf(S.tab) < 0) {
        S.tab = d.application && !S.startingNew ? d.application.stage : 'options';
      }
      render();
    };
    if (preloaded) { settle(preloaded); return Promise.resolve(); }
    return api('emp.dashboard').then(settle).catch(fail);
  }


  /**
   * `ack` is an optional standing confirmation: { title, lead, rows, next }.
   * Pass one for anything the participant needs evidence of having done —
   * a payment recorded, a section submitted, the notice signed.
   */
  function applyResult(r, ack) {
    if (r.dashboard) {
      S.dash = r.dashboard;
      // Same handover as loadEmployee's settle: once the repeat application
      // is really there, stop pretending.
      if (S.startingNew && r.dashboard.application && r.dashboard.application.editable) {
        S.startingNew = false;
      }
    }
    if (r.message) toast(r.message, 'ok');
    S.files = {};
    S.ack = ack ? Object.assign({ at: new Date() }, ack) : null;
    render();
  }


  /**
   * The standing confirmation panel, shown until dismissed.
   * Takes the ack object so employee, admin and partner screens can each
   * keep their own without competing for one slot of state.
   */
  function ackPanel(a) {
    if (!a) return '';
    var rows = (a.rows || []).filter(Boolean).map(function (r) {
      return '<dt>' + h(r[0]) + '</dt><dd' + (r[2] ? ' class="' + r[2] + '"' : '') + '>' + h(r[1]) + '</dd>';
    }).join('');
    return '<div class="panel ackpanel">' +
      '<div class="panel-bd">' +
      '<div class="ackhd"><span class="ticket">recorded</span>' +
      '<h2 class="sec" style="margin:0">' + h(a.title) + '</h2>' +
      '<button class="btn ghost small" id="ackClose">Dismiss</button></div>' +
      (a.lead ? '<p class="lede" style="margin-top:10px">' + a.lead + '</p>' : '') +
      (rows ? '<dl class="kv" style="margin-top:14px">' + rows + '</dl>' : '') +
      (a.next ? '<div class="callout" style="margin-top:14px"><h4>What happens next</h4><p>' + a.next + '</p></div>' : '') +
      '<p class="hint" style="margin-top:12px">Recorded at ' +
      h(a.at.toLocaleString('en-IN')) + '. Your application reference is your record of it.</p>' +
      '</div></div>';
  }

  /**
   * The tax route, once it is settled: a statement of what was chosen and
   * where it stands, in place of the chooser. Also says what the participant
   * should do next, because with a partner paying it is easy to assume the
   * application is finished when the notice is still unsigned.

  function taxRouteSettled(app, pr) {
    var self = app.tax.mode === 'Self';
    var stage = pr ? pr.status : '';


    var where = self
      ? 'You are paying the tax of ' + inr(app.taxAmount) + ' yourself.'
      : '<b>' + h(app.tax.fundPartnerName || 'A fund partner') + '</b> is funding your tax of ' +
        inr(app.taxAmount) + ', and the ' + cnt(app.totalShares) +
        ' shares from this exercise go to the demat account you hold with them.';


    var standing = self
      ? (app.tax.remaining > 0
        ? 'Recorded so far: ' + inr(app.tax.paidTotal) + '. Outstanding: <b>' +
          inr(app.tax.remaining) + '</b>.'
        : 'The full amount is recorded.')
      : stage === 'Payment Fed' || stage === 'Verified'
        ? 'The partner has recorded the payment' +
          (pr && pr.utr ? ' under UTR <span class="mono">' + h(pr.utr) + '</span>' : '') + '.'
        : stage === 'Sent Back'
          ? 'The ESOP team has sent the partner\'s payment back for correction. Nothing is needed from you.'
          : 'The request has been sent to them. They enter the demat account and the payment; ' +
            'you are emailed when they do.';


    // What to do next. The notice cannot be signed until the tax is settled,
    // so this is the moment the participant needs telling.
    var next = '';
    var taxDone = self ? app.tax.remaining <= 0 : (stage === 'Payment Fed' || stage === 'Verified');
    if (taxDone && !app.notice.signedAt) {
      next = '<p style="margin-top:10px"><b>What to do now:</b> go to step 5, read the exercise ' +
        'notice and sign it, then submit the application in step 6. It does not reach the ESOP ' +
        'team until you submit it.</p>';
    }


    return '<div class="callout ' + (taxDone ? 'info' : '') + '">' +
      '<h4>Your chosen route · ' + h(self ? 'Paying it yourself' : 'Fund partner') +
      (stage ? ' · ' + h(stage) : '') + '</h4>' +
      '<p>' + where + '</p>' +
      '<p style="margin-top:8px">' + standing + '</p>' +
      next +
      '<p class="hint" style="margin-top:10px">This choice is settled and cannot be changed here. ' +
      'If it has to change, write to the ESOP team — they send this section back to you, which ' +
      'releases it.</p></div>';

  function bindExercise() {
    // The exercise amount is a single payment, so the tally is a straight
    // comparison against what is due — checked as it is typed, not on submit.
    var exAmt = document.getElementById('exAmt');
    if (exAmt) {
      var tallyEx = function () {
        var due = S.dash.application ? S.dash.application.exerciseAmount : 0;
        var entered = Number(val('exAmt') || 0);
        var box = document.getElementById('exTally');
        if (!box) return;
        var diff = Math.round((entered - due) * 100) / 100;
        if (!entered) {
          box.className = 'hint';
          box.textContent = inr(due) + ' is due.';
        } else if (Math.abs(diff) <= 1) {
          box.className = 'hint';
          box.textContent = 'Matches the ' + inr(due) + ' due.';
        } else if (diff > 0) {
          box.className = 'hint err';
          box.textContent = inr(diff) + ' more than the ' + inr(due) + ' due.';
        } else {
          box.className = 'hint err';
          box.textContent = inr(-diff) + ' short of the ' + inr(due) + ' due.';
        }
      };
      exAmt.addEventListener('input', tallyEx);
      tallyEx();
    }

      return readFile('exProof').then(function (proof) {
        return {

      act('tm', function () {

        return api('emp.chooseTaxMode', {
          mode: mode,
          fundPartnerName: mode === 'FundPartner' ? (S.draft.taxPartner || val('fpSel')) : ''
        }).then(function (r) { S.draft = {}; applyResult(r); });
      });
    });


    // Live tally as the amount is typed, so a short or excess entry is obvious
    // before it is submitted rather than after.
    var amt = document.getElementById('txAmt');
    if (amt) {
      var tallyTax = function () {
        var tx = S.dash.application.tax;
        var entered = Number(val('txAmt') || 0);
        var box = document.getElementById('txTally');
        if (!box) return;
        if (!entered) {
          box.className = 'hint';
          box.textContent = inr(tx.remaining) + ' outstanding.';
        } else if (entered > tx.remaining + 1) {
          box.className = 'hint err';
          box.textContent = 'That is ' + inr(entered - tx.remaining) + ' more than the ' +
            inr(tx.remaining) + ' outstanding.';
        } else if (entered + 1 < tx.remaining) {
          box.className = 'hint';
          box.textContent = inr(entered) + ' now, leaving ' + inr(tx.remaining - entered) +
            ' to pay in a later entry.';
        } else {
          box.className = 'hint';
          box.textContent = 'This settles the tax in full.';
        }
      };
      amt.addEventListener('input', tallyTax);
      tallyTax();
    }

            rows: a ? [

              ['Tax due', inr(a.tax.due) + ' — ' + inWords(a.tax.due)],
              ['Recorded so far', inr(a.tax.paidTotal) + ' across ' + a.tax.payments.length +
                ' payment' + (a.tax.payments.length === 1 ? '' : 's')],
              settled ? null : ['Still to pay', inr(a.tax.remaining) + ' — ' + inWords(a.tax.remaining), 'crit'],
              ['Due by', a.prettyTaxDueDate]
            ] : [],
            next: settled
              ? 'Sign the exercise notice in step 5, then submit the application for verification.'
              : 'Record the remaining ' + (a ? inr(a.tax.remaining) : 'balance') + ' before ' +
                (a ? a.prettyTaxDueDate : 'the due date') + '. Each transfer needs its own UTR and proof.'
          });
        });
      });
    });


    document.querySelectorAll('[data-delpay]').forEach(function (b) {
      b.addEventListener('click', function () {

        act('txD', function () {

        });

    });

  function goAdminTab(tab) {

    if (tab === 'queue') return loadAdminQueue();

    if (tab === 'fmv') return loadAdminSub('admin.fmvList', {});
    if (tab === 'users') return loadAdminSub('admin.users', {});
    if (tab === 'config') return loadAdminSub('admin.config', {});

  function loadAdminQueue(preloaded) {

  }
  function loadAdminSub(method, payload) {
    return api(method, payload).then(function (d) { S.adminSub = { method: method, data: d }; render(); }).catch(fail);

  // A small CSV reader for one line (the heading row).
  function csvLine(line) {
    var out = [], f = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line.charAt(i);
      if (q) { if (c === '"') { if (line.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { out.push(f); f = ''; }
      else if (c !== '\r') f += c;

    return out;

  /**

   * leaves this computer.
   */
  function readTaxCsv(text) {
    var start = text.charCodeAt(0) === 0xFEFF ? 1 : 0;
    var nl = text.indexOf('\n', start);
    if (nl < 0) return { missing: [], rows: [], empty: true };
    var head = csvLine(text.slice(start, nl)).map(normHeader);
    var want = {}, missing = [];
    TAX_COLS.forEach(function (c) {
      var at = head.indexOf(normHeader(c[1]));
      if (at < 0) missing.push(c[1]); else want[at] = c[0];
    });
    if (missing.length) return { missing: missing, rows: [] };


    var rows = [], row = {}, col = 0, f = '', q = false, n = text.length;
    var keep = want[0] !== undefined, any = false;
    var endRow = function () {
      if (keep) { row[want[col]] = f; if (f !== '') any = true; }
      if (any) rows.push(row);
      row = {}; col = 0; f = ''; any = false; keep = want[0] !== undefined;
    };
    for (var i = nl + 1; i < n; i++) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"') { if (text.charAt(i + 1) === '"') { if (keep) f += '"'; i++; } else q = false; }
        else if (keep) f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { if (keep) { row[want[col]] = f; if (f !== '') any = true; } f = ''; col++; keep = want[col] !== undefined; }
      else if (c === '\n') endRow();
      else if (c !== '\r' && keep) f += c;

  function partnerReadiness(d) {
    var partners = d.partners || [];

        '<td>' + (p.contactEmails.length
          ? p.contactEmails.map(function (e) { return h(e); }).join('<br>')

          : cnt(p.totalRequests)) + '</td>' +
        '<td class="actions"><div class="row tight">' +

        // where the problem is shown rather than elsewhere on the page.
        (p.contactEmails.length && !p.logins.length
          ? '<button class="btn small" data-plogin="' + h(p.name) + '">Create login</button>'
          : '') +
        (p.active
          ? '<button class="btn danger small" data-pstat="' + h(p.name) + '" data-to="Inactive">Retire</button>'
          : '<button class="btn ghost small" data-pstat="' + h(p.name) + '" data-to="Active">Reinstate</button>') +

    var unusable = partners.filter(function (p) { return p.active && !p.selectable; });


    return '<div class="panel"><div class="panel-bd">' +
      '<div class="spread"><div><h2 class="sec">Fund partners</h2>' +
      '<p class="lede">Who a participant can route their tax through. Partners change, so this list ' +
      'is yours to manage — nothing here needs a code change. Use a shared mailbox rather than a ' +
      'personal address: people move firms.</p></div>' +
      '<div><button class="btn ghost small" id="newPartner">Add a fund partner</button></div></div>' +


      (partners.length
        ? '<div class="tablewrap" style="margin-top:14px"><table class="data"><thead><tr>' +
          '<th>Partner</th><th>Availability</th><th>Contact addresses</th><th>Portal logins</th>' +
          '<th class="n">Requests</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">No fund partners yet. Add one to offer the funded route.</div>') +


      (unusable.length
        ? '<div class="callout warn" style="margin-top:14px"><h4>' +
          h(unusable.map(function (p) { return p.name; }).join(', ')) +
          ' cannot be chosen yet</h4>' +
          '<p>A partner needs <b>both</b> a contact address and a portal login. Without a login ' +
          'nobody can enter the demat account or feed the payment, so the portal refuses the choice ' +
          'rather than telling a participant the partner was notified when it was not.</p>' +
          '<p>Add the contact address with <b>Contacts</b>, then the login with <b>Add a login</b> ' +
          'below — role <b>FundPartner</b>, then pick the partner.</p></div>'
        : '') +


      '<div class="callout info" style="margin-top:14px"><h4>Retiring a partner is safe</h4>' +
      '<p>A retired partner cannot be chosen by any new application, but every existing one keeps ' +
      'working — applications record their partner by name, so the history stays intact. Retiring ' +
      'is refused while requests are still in progress with them, since those participants are ' +
      'waiting on that partner to act.</p>' +
      '<p>A partner\'s <b>name</b> cannot be edited, for the same reason: it is what links their ' +
      'requests, their logins and their history together. To change a name, retire the old entry ' +
      'and add a new one.</p></div>' +
      '</div></div>';
  }

  /**
   * Some admin actions touch ~1,600 participants, which is more than one Apps
   * Script execution can finish. The server returns a cursor; keep calling
   * until it says it is done, reporting progress as we go.
   */
  function runBatched(method, verb) {
    var totalDone = 0;
    var allSkipped = [];


    function step(startAt) {
      return api(method, { startAt: startAt }).then(function (r) {
        totalDone += (r.created || r.sent || 0);
        if (r.skipped && r.skipped.length) allSkipped = allSkipped.concat(r.skipped);
        if (!r.done && r.nextAt !== null && r.nextAt !== undefined) {
          toast(totalDone + ' ' + verb + ' so far, ' + (r.total - r.nextAt) + ' to go…', 'ok');
          return step(r.nextAt);
        }
        toast(totalDone + ' ' + verb + ' in total.', 'ok');
        if (allSkipped.length) {
          modal('<h2 class="sec">Skipped (' + allSkipped.length + ')</h2>' +
            '<p class="lede">These were passed over. Fix the cause and run it again.</p>' +
            '<div class="mono" style="font-size:12px;line-height:1.7;margin-top:14px;max-height:340px;overflow:auto">' +
            allSkipped.map(function (s) { return h(s); }).join('<br>') + '</div>');
        }
        return r;
      });
    }
    return step(0);
  }

  /* Blob URLs handed out for document previews, revoked when the modal closes. */
  var _docUrls = [];


  function releaseDocUrls() {
    _docUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    _docUrls = [];
  }


  /**
   * Turn base64 from the server into a blob: URL.
   *
   * The previous version built a `data:` URI and pointed an iframe at it.
   * Chrome blocks frame navigation to data: URLs outright, so PDFs opened as
   * a blank pane — while <img src="data:…"> was unaffected, which is exactly
   * why only images appeared to work. A blob: URL is not blocked.
   */
  function blobUrl(base64, mimeType) {
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/octet-stream' }));
    _docUrls.push(url);
    return url;
  }


  function prettyBytes(n) {
    var v = Number(n || 0);
    if (v >= 1048576) return (v / 1048576).toFixed(1) + ' MB';
    if (v >= 1024) return Math.round(v / 1024) + ' KB';
    return v + ' bytes';
  }


  /** Preview one uploaded document, with a route through for anything unrenderable. */
  function showDocument(label, f) {
    releaseDocUrls();


    var actions =
      '<a class="btn ghost small" href="' + h(f.driveUrl) + '" target="_blank" rel="noopener">Open in Drive</a>';


    var viewer;
    if (f.tooLarge) {
      viewer = '<div style="padding:26px"><div class="callout warn"><h4>Too large to preview here</h4>' +
        '<p>' + h(f.name) + ' is ' + prettyBytes(f.sizeBytes) + '. Open it in Drive instead.</p></div></div>';
    } else if (f.mimeType === 'application/pdf') {
      // Not an <iframe>: Chrome will not start its PDF viewer inside a
      // sandboxed frame, and the whole portal is served inside one. The frame
      // came up blank, which is why only images ever appeared. The pages are
      // drawn to canvas instead — see renderPdfInto.
      viewer = '<div class="pdfpages" id="pdfPages"><div class="pdfwait">Opening ' + h(f.name) + '…</div></div>';
    } else if (f.mimeType && f.mimeType.indexOf('image/') === 0) {
      viewer = '<img src="' + blobUrl(f.base64, f.mimeType) + '" alt="' + h(f.name) + '">';
    } else {
      // A CML often arrives as a .docx or .xls, which no browser renders.
      var url = blobUrl(f.base64, f.mimeType);
      viewer = '<div style="padding:26px"><div class="callout"><h4>This file cannot be shown in the browser</h4>' +
        '<p>' + h(f.name) + ' · ' + h(f.mimeType || 'unknown type') + ' · ' + prettyBytes(f.sizeBytes) +
        '</p><p style="margin-top:10px"><a class="btn small" href="' + url + '" download="' + h(f.name) +
        '">Download it</a></p></div></div>';
    }


    modal('<div class="bar"><span><b>' + h(label) + '</b> · ' + h(f.name) +
      ' · ' + prettyBytes(f.sizeBytes) + '</span><span>' + actions + '</span></div>' + viewer, 'docview');


    // The modal markup is in the page now, so the canvases have somewhere
    // to go.
    if (f.mimeType === 'application/pdf' && !f.tooLarge) renderPdfInto('pdfPages', f);
  }


  /* PDF rendering -------------------------------------------------------- */


  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var _pdfLib = null;


  function loadPdfLib() {
    if (_pdfLib) return _pdfLib;
    _pdfLib = new Promise(function (resolve, reject) {
      if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
      var s = document.createElement('script');
      s.src = PDFJS_URL;
      s.onload = function () {
        if (!window.pdfjsLib) { reject(new Error('The PDF reader did not start.')); return; }
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) { /* main thread then */ }
        resolve(window.pdfjsLib);
      };
      s.onerror = function () { reject(new Error('The PDF reader could not be downloaded.')); };
      document.head.appendChild(s);
    }).catch(function (e) { _pdfLib = null; throw e; });
    return _pdfLib;
  }


  /**
   * Draw a PDF's pages into `hostId`.
   *
   * Capped at MAX_PDF_PAGES: these are CMLs, PAN copies and payment advices,
   * and a reviewer needs the first pages, not a hundred of them. Anything
   * longer says so and points at Drive.
   */
  var MAX_PDF_PAGES = 12;


  function renderPdfInto(hostId, f) {
    var host = document.getElementById(hostId);
    if (!host) return;


    var giveUp = function (why) {
      var el = document.getElementById(hostId);
      if (!el) return;
      el.innerHTML = '<div style="padding:26px"><div class="callout warn">' +
        '<h4>This PDF could not be shown here</h4><p>' + h(why) + '</p>' +
        '<p style="margin-top:10px">Use <b>Open in Drive</b> above — the file itself is fine.</p>' +
        '</div></div>';
    };


    loadPdfLib().then(function (lib) {
      var bytes;
      try {
        var raw = atob(f.base64);
        bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      } catch (e) {
        giveUp('The file could not be decoded.');
        return;
      }
      return lib.getDocument({ data: bytes }).promise.then(function (pdf) {
        var el = document.getElementById(hostId);
        if (!el) return;                                  // dialog already closed
        el.innerHTML = '';
        var shown = Math.min(pdf.numPages, MAX_PDF_PAGES);
        var width = Math.max(320, el.clientWidth - 28);


        var page = function (n) {
          if (n > shown) {
            if (pdf.numPages > shown) {
              var more = document.createElement('div');
              more.className = 'pdfwait';
              more.textContent = 'First ' + shown + ' of ' + pdf.numPages +
                ' pages shown. Open it in Drive for the rest.';
              el.appendChild(more);
            }
            return;
          }
          return pdf.getPage(n).then(function (p) {
            var base = p.getViewport({ scale: 1 });
            // Render at the container's width, and at the screen's pixel
            // density so text stays legible rather than soft.
            var scale = (width / base.width) * Math.min(2, window.devicePixelRatio || 1);
            var vp = p.getViewport({ scale: scale });
            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);
            canvas.style.width = width + 'px';
            if (!document.getElementById(hostId)) return;
            el.appendChild(canvas);
            return p.render({ canvasContext: canvas.getContext('2d'), viewport: vp })
              .promise.then(function () { return page(n + 1); });
          });
        };
        return page(1);
      });
    }).catch(function (e) {
      giveUp(e && e.message ? e.message : 'Unknown problem.');
    });
  }

  function bulkDetailsDialog() {
    modal('<h2 class="sec">Paste PAN and demat details</h2>' +
      '<p class="lede">For participants whose details you already hold. These are prefilled onto their ' +
      'next application — they still see every value, can correct it, and still have to attach a CML.</p>' +
      '<div class="callout info" style="margin-top:14px"><h4>One participant per line, tab or comma separated</h4>' +
      '<p class="mono" style="font-size:12px;margin-top:8px">Employee&nbsp;ID · PAN · Account&nbsp;type · ' +
      'DP&nbsp;name · DP&nbsp;ID · Client&nbsp;ID · Holder&nbsp;name · Mobile · Address</p>' +
      '<p style="margin-top:8px">Paste straight from a spreadsheet with those nine columns in that order. ' +
      'Leave a cell blank to leave that value untouched — only the Employee ID is required.</p></div>' +
      '<div class="field" style="margin-top:16px"><label for="bdData">Rows</label>' +
      '<textarea id="bdData" style="min-height:200px;font-family:\'IBM Plex Mono\',monospace;font-size:12px" ' +
      'placeholder="PW4872\tABCDE1234F\tNSDL\tHDFC Securities\tIN300123\t12345678\tKamesh Isame\t9876543210\tNoida"></textarea></div>' +
      '<div class="row" style="margin-top:16px">' +
      '<button class="btn" id="bdGo" data-busy="bd" data-busy-label="Applying…">Apply</button>' +
      '<button class="btn ghost" id="bdNo">Cancel</button></div>');


    document.getElementById('bdNo').addEventListener('click', closeModal);
    document.getElementById('bdGo').addEventListener('click', function () {
      act('bd', function () {
        var rows = val('bdData').split(/\r?\n/).map(function (line) {
          if (!line.trim()) return null;
          var c = line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function (x) {
            return x.trim().replace(/^"|"$/g, '');
          });
          if (!c[0]) return null;
          return {
            employeeId: c[0], pan: c[1] || '', dematAccountType: c[2] || '',
            dematDPName: c[3] || '', dematDPId: c[4] || '', dematClientId: c[5] || '',
            dematAccountName: c[6] || '', mobile: c[7] || '', address: c[8] || ''
          };
        }).filter(Boolean);
        if (!rows.length) throw new Error('Paste at least one row.');


        return api('admin.bulkDetails', { rows: rows }).then(function (r) {
          closeModal();
          toast(r.message, 'ok');
          if ((r.warnings && r.warnings.length) || (r.skipped && r.skipped.length)) {
            var block = function (title, items, cls) {
              if (!items || !items.length) return '';
              return '<h3 class="sub" style="margin-top:16px">' + h(title) + ' (' + items.length + ')</h3>' +
                '<div class="' + cls + '" style="font-size:12.5px;line-height:1.7;margin-top:8px;' +
                'max-height:220px;overflow:auto">' +
                items.map(function (x) { return h(x); }).join('<br>') + '</div>';
            };
            modal('<h2 class="sec">Applied, with notes</h2>' +
              '<p class="lede">' + h(r.message) + '</p>' +
              block('Not recognised', r.skipped, 'dim') +
              block('Warnings', r.warnings, 'dim'));
          }
          return loadAdminSub('admin.employees', { search: val('empSearch'), only: val('empOnly') });
        });
      });
    });
  }

      '<button class="btn ghost" id="uCancel">Cancel</button></div>');


    var roleSel = document.getElementById('uRole');
    roleSel.addEventListener('change', function () {
      document.getElementById('uPartnerWrap').hidden = roleSel.value !== 'FundPartner';
    });
    document.getElementById('uCancel').addEventListener('click', closeModal);
    document.getElementById('uSave').addEventListener('click', function () {
      act('u', function () {
        return api('admin.provisionUser', {
          userId: val('uId'), role: val('uRole'), name: val('uName'),
          email: val('uEmail'), fundPartnerName: val('uPartner'),
          sendEmail: checked('uSend')
        }).then(function (r) {
          toast(r.message, 'ok');
          if (r.emailed) closeModal(); else showOneTimeCode(r);
          return loadAdminSub('admin.users', {});
        });
      });
    });
  }


  /* ======================================================================
     BOOT
     ====================================================================== */


  // One call: branding, the session if the saved token is still valid, and
  // the landing screen. Sending the token up front is what lets the server
  // answer all three at once.
  try { S.token = sessionStorage.getItem(TOKEN_KEY) || null; } catch (e) {}


  api('boot').then(function (b) {
    S.boot = b;
    if (!b.session) {
      // No token, or it has expired. Either way the login screen is next.
      if (S.token) { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
      S.token = null;
      render();
      return;
    }
    S.user = b.session;
    return afterLogin(b.home);
  }).catch(function (e) {
    document.getElementById('boot').innerHTML =
      '<div class="boot-inner"><div class="boot-text">The portal could not start: ' + h(e.message) + '</div></div>';
  });


})();
</script>
