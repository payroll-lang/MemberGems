<style>
/* ============================================================
   ESOP Exercise Portal — one stylesheet.
   Palette taken from share-certificate safety paper: bone ground,
   engraved green, ochre for anything not yet done, oxide for money out.
   ============================================================ */


:root{
  --ground:#f6f7f3;
  --surface:#ffffff;
  --surface-2:#f0f2ec;
  --ink:#14211c;
  --ink-2:#4a5b53;
  --ink-3:#7c8b83;
  --rule:#dde2da;
  --rule-strong:#c2cabe;
  --accent:#1b6046;
  --accent-2:#2e8b65;
  --accent-wash:#e8efe9;
  --good:#1b6046;
  --warn:#a8741a;
  --warn-wash:#f7efdd;
  --crit:#a33529;
  --crit-wash:#f8ebe8;
  --shadow:0 1px 2px rgba(20,33,28,.06);
  --shadow-lift:0 6px 24px rgba(20,33,28,.13);
  color-scheme:light;
}


*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none !important}
a{color:var(--accent)}


/* ---------------- boot ---------------- */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:50}
.boot-inner{text-align:center}
.boot-mark{
  width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
  border:2px solid var(--rule-strong);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-text{font-size:12.5px;color:var(--ink-2);letter-spacing:.02em}
/* The rotating "did you know" line under a loading spinner. Every screen in
   this portal costs a round trip, so the wait is unavoidable — this makes it
   tell the reader something instead of nothing. */
.boot-fact{
  max-width:430px;margin:18px auto 0;padding:0 18px;
  font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.55;
  color:var(--ink);transition:opacity .22s ease;
}
.boot-fact span{
  display:block;font-family:"Archivo",system-ui,sans-serif;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;
}
/* The same panel, used inside the app rather than over the whole window. */
.loadbox{display:grid;place-items:center;padding:64px 0 72px;text-align:center}
.loadwhat{font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;margin-top:2px}
@media (prefers-reduced-motion:reduce){.boot-mark{animation:none;border-top-color:var(--rule-strong)}}


/* ---------------- shell ---------------- */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--rule-strong);
  position:sticky;top:0;z-index:20;
}
.topbar-in{
  max-width:1180px;margin:0 auto;padding:11px 22px;
  display:flex;align-items:center;gap:20px;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand > div{display:flex;align-items:baseline;gap:11px;min-width:0}
/* The company logo. Height-constrained with width:auto so the aspect ratio
   is never distorted, whatever file is configured. */
.logo{display:block;width:auto;flex:0 0 auto}
.logo.mark{height:30px}
.logo.crest{height:52px;margin-bottom:14px}
.brand .co{
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;white-space:nowrap;
}
.brand .nm{font-family:"Newsreader",Georgia,serif;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.topnav{display:flex;gap:2px;flex-wrap:wrap}
.topnav button{
  font:inherit;font-size:13px;background:none;border:0;cursor:pointer;color:var(--ink-2);
  padding:6px 11px;border-radius:2px;
}
.topnav button:hover{background:var(--surface-2);color:var(--ink)}
.topnav button[aria-current="true"]{background:var(--accent-wash);color:var(--accent);font-weight:500}
.who{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.who .role{
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--rule-strong);border-radius:2px;padding:2px 6px;color:var(--ink-3);
}


.page{max-width:1180px;margin:0 auto;padding:26px 22px 80px}


/* ---------------- typography ---------------- */
h1.title{
  font-family:"Newsreader",Georgia,serif;font-weight:400;
  font-size:clamp(26px,3.6vw,36px);line-height:1.08;margin:0;letter-spacing:-.013em;
  text-wrap:balance;
}
h1.title em{font-style:italic;color:var(--accent)}
h2.sec{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:21px;margin:0;letter-spacing:-.01em}
h3.sub{font-size:13px;font-weight:600;margin:0}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.lede{color:var(--ink-2);margin:.4em 0 0;max-width:68ch}
.dim{color:var(--ink-3)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}


/* ---------------- figure row ---------------- */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:1px solid var(--rule);margin:22px 0 0}
.fig{padding:16px 20px 18px 0;border-right:1px solid var(--rule)}
.fig:last-child{border-right:0}
.fig .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.fig .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:23px;line-height:1.15;margin-top:7px;letter-spacing:-.02em}
.fig .s{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.fig.accent .v{color:var(--accent)}
.fig.warn .v{color:var(--warn)}
.fig.crit .v{color:var(--crit)}


/* ---------------- cards & panels ---------------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:2px;box-shadow:var(--shadow)}
/* The standing confirmation of a completed action. Deliberately not a toast:
   it is the participant's on-screen evidence that the thing happened. */
.ackpanel{border-left:3px solid var(--accent)}
/* Numbered steps on the admin guide. */
.guidestep{display:flex;gap:14px;align-items:flex-start;margin-top:18px}
.guidestep + .guidestep{padding-top:18px;border-top:1px solid var(--rule)}
.guidestep .num{
  flex:0 0 26px;height:26px;border-radius:50%;
  border:1px solid var(--rule-strong);color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;
}
.guidestep code,.panel-bd code{
  font-family:"IBM Plex Mono",monospace;font-size:.88em;
  padding:1px 4px;border-radius:3px;background:var(--surface-2);border:1px solid var(--rule);
}
.ackhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ackhd .btn{margin-left:auto}
.ticket{
  display:inline-block;padding:2px 8px;border-radius:3px;
  border:1px solid var(--accent);color:var(--accent);
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
}
.panel-hd{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.panel-bd{padding:18px}
.panel-ft{padding:13px 18px;border-top:1px solid var(--rule);background:var(--surface-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}


.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.tight{gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.spread{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}


.callout{border:1px solid var(--rule-strong);border-left:3px solid var(--accent);background:var(--surface);padding:12px 15px;border-radius:2px}
.callout.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.callout.crit{border-left-color:var(--crit);background:var(--crit-wash)}
.callout.info{border-left-color:var(--accent);background:var(--accent-wash)}
.callout h4{margin:0 0 5px;font-size:12.5px;font-weight:600}
.callout p{margin:0;font-size:13px;color:var(--ink-2)}
.callout p + p{margin-top:7px}
.bankbox{font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:pre-line;margin-top:8px;color:var(--ink)}


/* ---------------- stepper ---------------- */
.stepper{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);background:var(--surface);border-radius:2px;overflow:hidden;box-shadow:var(--shadow)}
.step{
  flex:1 1 150px;min-width:0;text-align:left;background:none;border:0;border-right:1px solid var(--rule);
  font:inherit;cursor:pointer;padding:12px 14px;position:relative;color:var(--ink-2);
}
.step:last-child{border-right:0}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-wash)}
.step .n{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;
}
.step .l{font-size:12.5px;margin-top:4px;color:var(--ink);font-weight:500;line-height:1.3}
.step[aria-current="true"] .l{color:var(--accent)}
.step .tick{width:13px;height:13px;border-radius:50%;border:1px solid var(--rule-strong);display:inline-grid;place-items:center;font-size:9px;line-height:1}
.step.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done .tick::after{content:"✓"}
/* A step the ESOP team has sent back: not done, however fully it was filled in. */
.step.back{background:var(--crit-wash)}
.step.back .tick{background:var(--crit);border-color:var(--crit);color:#fff}
.step.back .tick::after{content:"!"}
.step.back .n,.step.back .l{color:var(--crit)}
.step.blocked{opacity:.55;cursor:not-allowed}


/* ---------------- tables ---------------- */
.tablewrap{overflow-x:auto}
/* Every data table lives in a .tablewrap that scrolls, so the floor below is
 * about legibility, not fitting: a table is allowed to overflow and scroll,
 * but never to crush its columns into each other.
 *
 * 520px was the old floor, chosen when the tables were small. The real ones
 * grew to seven, ten, even twelve columns — the verification queue and the
 * participants list among them — which at 520px is about 43px a column, so
 * headings and values collided. 880px suits those; the handful of genuinely
 * narrow tables set a smaller floor of their own.
 */
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:880px}
table.data th{
  text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:9px 12px 9px 0;
  border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--surface);
}
table.data td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
/* Right-aligned numeric columns.
 *
 * The whole gap between two columns comes from the RIGHT padding of the cell
 * on the left, because cells have no left padding. So padding-right:0 here —
 * which is what this rule used to say — left a right-aligned number touching
 * whatever followed it: "₹128.57Manual", "FMVSOURCE" in the heading. It read
 * as a rendering fault and appeared in every table with a numeric column
 * followed by another column, across both portals.
 *
 * The last cell in a row still sits flush to the table edge, which is what
 * padding-right:0 was reaching for in the first place.
 */
table.data th.n,table.data td.n{
  text-align:right;padding-right:20px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
table.data th:last-child,table.data td:last-child{padding-right:0}
/* A cell holding buttons.
 *
 * `class="row tight"` was being put on the <td> itself, which made the cell a
 * flex container — a table cell cannot be one and still lay out as a cell, so
 * the buttons escaped their column and sat on top of the number to their
 * left. The flex row belongs in a div INSIDE the cell.
 */
table.data td.actions{text-align:right;white-space:nowrap;padding-left:18px}
table.data td.actions > .row{justify-content:flex-end;flex-wrap:nowrap}
/* Numbers and dates must never be broken across lines; prose may wrap. */
table.data td.nowrap,table.data th.nowrap{white-space:nowrap}
table.data tbody tr.clickable{cursor:pointer}
table.data tbody tr.clickable:hover{background:var(--surface-2)}
table.data tfoot td{border-top:1px solid var(--rule-strong);border-bottom:0;font-weight:600;padding-top:11px}


/* ---------------- pills ---------------- */
.pill{
  display:inline-block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;
  padding:3px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent;
}
.pill.ok{color:var(--good);background:var(--accent-wash);border-color:#cfe0d5}
.pill.wait{color:var(--warn);background:var(--warn-wash);border-color:#e8d5ab}
.pill.bad{color:var(--crit);background:var(--crit-wash);border-color:#e8c9c3}
.pill.neutral{color:var(--ink-3);background:var(--surface-2);border-color:var(--rule)}


/* ---------------- forms ---------------- */
.field{margin:0}
.field + .field{margin-top:16px}
.field label,.flabel{
  display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin-bottom:6px;
}
.field .hint{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.field .hint.err{color:var(--crit)}
/* Says which fields are refused at submit, rather than leaving it to be
   discovered. A word reads better than a bare asterisk. */
.req{
  display:inline-block;margin-left:7px;padding:1px 5px;border-radius:3px;
  font-size:9px;letter-spacing:.09em;font-weight:600;
  color:var(--crit);border:1px solid currentColor;opacity:.85;
  vertical-align:1px;
}
.field.missing input,.field.missing select,.field.missing textarea{border-color:var(--crit)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],select,textarea{
  width:100%;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:2px;padding:9px 11px;
  font-family:inherit;font-size:14px;
}
input[type=number],input.mono,input[type=date]{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
}
textarea{min-height:78px;resize:vertical;line-height:1.5}
select{cursor:pointer}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent-2);outline-offset:2px;
}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.inputrow{display:flex;gap:0;align-items:stretch}
.inputrow .prefix{
  display:flex;align-items:center;padding:0 11px;border:1px solid var(--rule-strong);border-right:0;
  background:var(--surface-2);color:var(--ink-2);font-family:"IBM Plex Mono",monospace;
  border-radius:2px 0 0 2px;white-space:nowrap;
}
.inputrow .prefix + input{border-radius:0 2px 2px 0}
.inputrow.split{gap:8px}
.inputrow.split input{flex:1}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55}
.checkline input[type=checkbox],.checkline input[type=radio]{width:auto;margin:3px 0 0;accent-color:var(--accent);flex:none}
.radiocards{display:grid;gap:9px}
.radiocard{
  display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule-strong);border-radius:2px;
  padding:12px 14px;cursor:pointer;background:var(--surface);
}
.radiocard:hover{border-color:var(--accent)}
.radiocard.sel{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 2px 0 0 var(--accent)}
.radiocard input{margin-top:2px;flex:none}
/* The label and its explanation are spans, and an inline span neither takes a
   top margin nor starts a new line — which ran them together as
   "I will pay the tax myselfTransfer ₹84,518". They have to be blocks. */
.radiocard>span{display:block;flex:1 1 auto;min-width:0}
.radiocard .t{display:block;font-size:13.5px;font-weight:500}
.radiocard .d{display:block;font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.5}


/* password field with a reveal button */
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:44px;width:100%}
.pwwrap .eye{
  position:absolute;top:0;right:0;height:100%;width:42px;
  display:grid;place-items:center;
  background:none;border:0;padding:0;cursor:pointer;color:var(--ink-3);
}
.pwwrap .eye:hover{color:var(--accent)}
.pwwrap .eye:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}


/* file input */
.filebox{border:1px dashed var(--rule-strong);border-radius:2px;padding:13px 14px;background:var(--surface-2)}
.filebox input[type=file]{width:100%;font-size:12.5px;font-family:inherit}
.filebox .cur{font-size:12px;margin-top:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.filebox .cur .name{font-family:"IBM Plex Mono",monospace;font-size:11.5px}


/* ---------------- buttons ---------------- */
.btn{
  font:inherit;font-weight:500;font-size:13.5px;cursor:pointer;border-radius:2px;
  padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;
  white-space:nowrap;
}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--rule-strong)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn.danger{background:none;color:var(--crit);border-color:#e8c9c3}
.btn.danger:hover{background:var(--crit-wash);border-color:var(--crit)}
.btn.small{font-size:12px;padding:6px 11px}
.btn.link{background:none;border:0;color:var(--accent);padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.btn.link:hover{background:none;color:var(--accent-2)}
.btn.block{width:100%;text-align:center}


/* ---------------- settlement note (dot leaders) ---------------- */
.note{background:var(--surface);border:1px solid var(--rule-strong);border-radius:2px;box-shadow:var(--shadow);overflow:hidden}
.note .engrave{height:5px;border-bottom:1px solid var(--rule-strong);background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 6px);opacity:.5}
.note h3{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:16.5px;margin:0;padding:14px 17px 0}
.note .subh{padding:3px 17px 0;font-size:11.5px;color:var(--ink-2)}
.lines{padding:13px 17px 15px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:baseline;gap:6px;font-size:13px}
.line .lbl{color:var(--ink-2)}
.line .lead{flex:1;border-bottom:1px dotted var(--rule-strong);min-width:10px;transform:translateY(-3px)}
.line .amt{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.line.sub .lbl,.line.sub .amt{font-size:11px;color:var(--ink-3)}
.line.out .amt{color:var(--crit)}
.line.total{margin-top:5px;padding-top:10px;border-top:1px solid var(--rule-strong)}
.line.total .lbl{color:var(--ink);font-weight:500}
.line.total .amt{font-size:17px;font-weight:500}
/* The amount spelled out, under the figure it belongs to. */
.line.words .lbl{font-size:11px;color:var(--ink-3);font-style:italic;line-height:1.5}


/* "How was this worked out" — an ⓘ against every calculated figure. */
.ibtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;margin-left:5px;padding:0;
  border:1px solid var(--rule-strong);border-radius:50%;
  background:transparent;color:var(--ink-3);cursor:pointer;
  font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:10.5px;
  line-height:1;vertical-align:1px;
}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.formula{
  margin-top:12px;padding:12px 14px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.6;color:var(--ink-2);
}
/* A figure with its words underneath, for anything someone pays against. */
.amt-words{display:inline-flex;flex-direction:column;gap:2px}
.amt-words em{font-style:italic;font-size:11px;color:var(--ink-3);font-family:inherit}


/* ---------------- login ---------------- */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr;place-items:center;padding:36px 20px}
.authcard{width:100%;max-width:412px}
.authcard .mast{margin-bottom:22px}
.authcard .mast h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:31px;margin:5px 0 0;letter-spacing:-.014em}
.authcard .mast h1 em{font-style:italic;color:var(--accent)}
.authpanel{background:var(--surface);border:1px solid var(--rule-strong);border-radius:2px;box-shadow:var(--shadow-lift);overflow:hidden}
.authpanel .engrave{height:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 6px);opacity:.5;border-bottom:1px solid var(--rule-strong)}
.authpanel .bd{padding:22px}
.authfoot{margin-top:16px;font-size:12px;color:var(--ink-3);line-height:1.6}
.authtabs{display:flex;border-bottom:1px solid var(--rule)}
.authtabs button{
  flex:1;font:inherit;font-size:12.5px;background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 8px;cursor:pointer;color:var(--ink-2);
}
